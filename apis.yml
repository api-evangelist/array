aid: array
name: Array
description: Array is an embedded fintech products platform that lets financial institutions, fintechs,
  credit-service companies, and consumer brands seamlessly integrate consumer credit, identity, and background
  data into their own user experiences and marketing funnels. Array packages products such as credit scores
  and monitoring (My Credit Manager), identity and privacy protection, background checks, credit building
  (BuildCredit), debt management and navigation, an offers engine, property and home-value data, and a
  subscription manager, delivered as embeddable white-label components, private- label experiences, and
  APIs so clients can drive engagement, conversion, revenue, and consumer financial progress. Headquartered
  in New York City and led by CEO Martin Toha, Array is backed by investors including General Catalyst.
  This profile was seeded from a VC portfolio lead and enriched from Array's public website; its developer
  documentation (docs.array.com, on ReadMe) is password-gated, so no public OpenAPI or SDK surface could
  be harvested.
