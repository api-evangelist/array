telemetry:
  endpoint: /componentAnalytics/v1
  headers:
  - x-array-web-component
  - x-array-web-component-referrer
  note: >-
    Every embedded component reports its name and the embedding page's full URL back to
    Array. Worth knowing before embedding on an authenticated page.
