notes: >-
  Array publishes a real-time and historical system-status page on Atlassian Statuspage,
  and — usefully — the standard Statuspage JSON API is open on it, so status is genuinely
  machine-readable even though nothing else about Array's API is. Thirteen product
  components are tracked individually. No public versioning policy, deprecation policy,
  SLA, or RFC 8594 Sunset/Deprecation header support could be confirmed: Array's developer
  documentation (docs.array.com, on ReadMe) is password-protected at every path and no
  public OpenAPI exists. The one versioning fact that IS observable is the API's own path
  shape — see versioning below, read from live routes rather than from documentation.
