notes: >-
  Array publishes NO client library to any public package registry. npm, PyPI, RubyGems,
  crates.io, Maven Central, NuGet and pkg.go.dev were searched for array, array-io,
  array.io and credmo and none returned a first-party Array package. What Array does ship
  is two first-party JavaScript libraries served directly from its own CDN at
  embed.array.io — the integration path for every Array embedded component. They are
  unversioned: the URLs carry no version segment, the responses carry no Last-Modified,
  and there is no changelog, so version and published are recorded as null rather than
  guessed. An unversioned, registry-absent client library gives an integrator no way to
  pin, audit, or diff what they are loading into their page.
